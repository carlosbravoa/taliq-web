<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada | Taliq</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%230E9E8A'/%3E%3Crect x='16' y='17' width='32' height='9' rx='1.5' fill='%23fff'/%3E%3Crect x='28' y='17' width='8' height='32' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<!--
  Deliberadamente sin recursos externos: ni hoja de estilos, ni script, ni <img>.
  assets/styles.css es la marca que usa el dashboard (dashboard/README.md) para
  contar quién leyó una página de verdad. Si esta página la enlazara, cada URL
  mal escrita y cada escaneo de bots entraría en ese número y lo inflaría, que es
  justo la forma en que una medición rota pasa desapercibida. Todo va en línea.
-->
<style>
  :root{
    --ink:#141E28; --text-2:#3E4E5C; --paper:#FCFBF9; --surface:#FFFFFF;
    --line:#E3E0D8; --accent:#0E9E8A; --accent-2:#0A7D6D; --accent-3:#D8F3EE;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 24px;
    background:var(--paper); color:var(--ink); line-height:1.55;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .box{max-width:560px; width:100%; text-align:center}
  /* flex, not inline-flex: it must take the whole line so the badge below it
     starts a new one instead of sitting beside the wordmark. */
  .brand{
    display:flex; justify-content:center; align-items:center; gap:.55rem;
    font-weight:700; font-size:1.15rem; color:var(--ink); text-decoration:none;
    margin-bottom:2.2rem;
  }
  .brand__mark{
    width:26px; height:26px; border-radius:7px; background:var(--accent); color:#fff;
    display:grid; place-items:center; font-size:.9rem; font-weight:700;
  }
  .code{
    display:inline-block; font-size:.78rem; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent-2); background:var(--accent-3);
    padding:.3rem .7rem; border-radius:99px; margin-bottom:1rem;
  }
  h1{font-size:clamp(1.5rem,4vw,2rem); line-height:1.2; margin:0 0 .7rem; letter-spacing:-.01em}
  p{margin:0 auto; color:var(--text-2); font-size:1rem; max-width:44ch}
  .links{
    display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin:2rem 0 1.6rem;
  }
  .btn{
    display:inline-block; padding:.62rem 1.15rem; border-radius:10px; font-size:.93rem;
    font-weight:600; text-decoration:none; border:1px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  .btn--primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .foot{font-size:.87rem; color:var(--text-2)}
  .foot a{color:var(--accent-2)}
  @media (prefers-reduced-motion:no-preference){
    .btn{transition:border-color .15s, background .15s}
  }
  .btn:hover{border-color:var(--accent)}
  .btn--primary:hover{background:var(--accent-2)}
</style>
</head>
<body>
  <main class="box">
    <a class="brand" href="/"><span class="brand__mark">T</span>Taliq</a>
    <div class="code">Error 404</div>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté roto, que la dirección tenga un error de escritura
       o que la página se haya movido.</p>
    <div class="links">
      <a class="btn btn--primary" href="/">Ir al inicio</a>
      <a class="btn" href="/como-funciona.html">Cómo funciona</a>
      <a class="btn" href="/planes.html">Planes</a>
      <a class="btn" href="/seguridad.html">Seguridad</a>
    </div>
    <p class="foot">¿Buscabas algo puntual? Escríbenos a
       <a href="mailto:hola@taliq.cl">hola@taliq.cl</a>.</p>
  </main>
</body>
</html>
